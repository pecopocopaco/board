<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070a" />
<meta name="description" content="SENDAI LIVE COMMAND CENTER — 仙台の今を一画面で把握するリアルタイム管制室風ダッシュボード" />
<title>SENDAI LIVE COMMAND CENTER</title>

<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./src/styles/base.css">
<link rel="stylesheet" href="./src/styles/dashboard.css">
<link rel="stylesheet" href="./src/styles/widgets.css">
</head>
<body>
<div id="app">
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>

  <header class="header">
    <div>
      <div class="brand">SENDAI LIVE COMMAND CENTER<small id="headerDate">-- -- --</small></div>
    </div>
    <div style="text-align:center;">
      <div class="header-clock" id="headerClock">--:--:--</div>
      <div class="header-meta" id="headerMeta">SENDAI</div>
    </div>
    <div class="header-right">
      <span class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusText">ONLINE</span></span>
      <button class="icon-btn" id="searchBtn" aria-label="検索" title="検索 (/)">⌕</button>
      <button class="icon-btn" id="paletteBtn" aria-label="コマンドパレット" title="⌘/Ctrl+K">⌘K</button>
    </div>
  </header>

  <div class="alert-bar" id="alertBar" role="status">● ALL SYSTEMS NORMAL</div>

  <nav class="tabs" id="tabs" aria-label="セクション"></nav>

  <main>
    <div class="widget-grid" id="widgetGrid"></div>
    <footer class="hint">SENDAI LIVE COMMAND CENTER — ADAPTER ARCHITECTURE — LAST UPDATED <span id="footUpdated">--</span></footer>
  </main>
</div>

<div class="overlay hidden" id="searchOverlay">
  <div class="overlay-panel">
    <input class="overlay-input" id="searchInput" placeholder="ウィジェットを検索… 例: 天気 / JR / 地震" autocomplete="off" />
    <div class="overlay-results" id="searchResults"></div>
    <div class="overlay-hint">ESC で閉じる</div>
  </div>
</div>

<div class="overlay hidden" id="paletteOverlay">
  <div class="overlay-panel">
    <input class="overlay-input" id="paletteInput" placeholder="&gt; コマンドを入力…" autocomplete="off" />
    <div class="overlay-results" id="paletteResults"></div>
    <div class="overlay-hint">↑↓ で選択 / Enter で実行 / ESC で閉じる</div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
